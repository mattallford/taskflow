name: Build and Push

permissions:
  contents: read
  security-events: write  # Required for SARIF upload
  actions: read
  id-token: write

on:
  push:
    branches: [ main, 'feature/**', 'hotfix/**' ]
    paths:
      - '.github/workflows/build.yml'
      - 'GitVersion.yml'
      - 'deploy/k8s/**'
      - 'src/**'
      - 'README.md'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'
      - 'GitVersion.yml'
      - 'deploy/k8s/**'
      - 'src/**'
      - 'README.md'
  workflow_dispatch:

# Main builds run one at a time so each one sees the previous build's version tag
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.custom_version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for GitVersion

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.7.0
      with:
        versionSpec: '6.8.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v4.7.0

    - name: Create Clean Version
      id: custom_version
      run: |
        # main:  1.1.42 (the next patch after the latest v* tag; each main build tags itself)
        # PR:    1.1.42-pr16.3 (pre-release of the next patch, numbered by commits since that tag)
        # other: 1.1.42-feature-x.3 (built but never published)
        # The pre-release tag is what Octopus channel rules use to keep branch builds out of Production
        BASE="${{ steps.gitversion.outputs.majorMinorPatch }}"
        DISTANCE="${{ steps.gitversion.outputs.versionSourceDistance }}"
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          VERSION="$BASE-pr${{ github.event.pull_request.number }}.$DISTANCE"
        elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
          VERSION="$BASE"
        else
          VERSION="$BASE-${{ steps.gitversion.outputs.escapedBranchName }}.$DISTANCE"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Clean version: $VERSION"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy Repo Scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # .NET API Tests
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Restore .NET dependencies
      run: dotnet restore TaskFlow.sln
      
    - name: Build .NET solution
      run: dotnet build TaskFlow.sln --no-restore --configuration Release
      
    - name: Run .NET tests
      run: dotnet test TaskFlow.sln --no-build --configuration Release --verbosity normal

    # React Frontend Tests
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/TaskFlow.Web/package-lock.json
        
    - name: Install frontend dependencies
      working-directory: src/TaskFlow.Web
      run: npm ci
      
    - name: Run frontend tests
      working-directory: src/TaskFlow.Web
      run: npm test -- --watchAll=false --passWithNoTests
      env:
        CI: true


  build:
    name: Build ${{ matrix.platform }}
    needs: [version, test]  # Need version for labels, test must pass before building
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    env:
      PUBLISH: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      if: env.PUBLISH == 'true'
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Each architecture is pushed by digest only (no tag). The manifest job then
    # tags a single multi-arch image, so there are no -amd64/-arm64 tags.
    - name: Build and push API image by digest (${{ matrix.arch }})
      id: build_api
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./src/TaskFlow.Api/Dockerfile
        platforms: ${{ matrix.platform }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ needs.version.outputs.version }}
        outputs: type=image,name=${{ secrets.DOCKER_USERNAME }}/taskflow-api,push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
        cache-from: type=gha,scope=api-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=api-${{ matrix.arch }}

    - name: Build and push Web image by digest (${{ matrix.arch }})
      id: build_web
      uses: docker/build-push-action@v7
      with:
        context: ./src/TaskFlow.Web
        file: ./src/TaskFlow.Web/Dockerfile
        platforms: ${{ matrix.platform }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ needs.version.outputs.version }}
        outputs: type=image,name=${{ secrets.DOCKER_USERNAME }}/taskflow-web,push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
        cache-from: type=gha,scope=web-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=web-${{ matrix.arch }}

    - name: Export digests
      if: env.PUBLISH == 'true'
      run: |
        mkdir -p digests/api digests/web
        API_DIGEST="${{ steps.build_api.outputs.digest }}"
        WEB_DIGEST="${{ steps.build_web.outputs.digest }}"
        touch "digests/api/${API_DIGEST#sha256:}" "digests/web/${WEB_DIGEST#sha256:}"

    - name: Upload digests
      if: env.PUBLISH == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: digests-${{ matrix.arch }}
        path: digests/
        if-no-files-found: error
        retention-days: 1

  manifest:
    name: Create Multi-Arch Manifests
    needs: [version, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
    - name: Download digests
      uses: actions/download-artifact@v8
      with:
        pattern: digests-*
        merge-multiple: true
        path: digests

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Tag one multi-arch image per app from the per-architecture digests.
    # latest is only moved by main builds, so branch builds never become latest.
    - name: Create multi-arch manifests
      run: |
        for APP in api web; do
          IMAGE="${{ secrets.DOCKER_USERNAME }}/taskflow-$APP"
          TAGS="-t $IMAGE:${{ needs.version.outputs.version }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="$TAGS -t $IMAGE:latest"
          fi
          # shellcheck disable=SC2086,SC2046 # TAGS and the digest list are meant to split into arguments
          docker buildx imagetools create $TAGS $(cd digests/$APP && printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ needs.version.outputs.version }}"
        done

    - name: Build summary
      run: |
        VERSION="${{ needs.version.outputs.version }}"
        {
          echo "## Multi-Arch Build Complete ✅"
          echo ""
          echo "- **Version**: \`$VERSION\`"
          echo "- **API**: \`taskflow-api:$VERSION\` (linux/amd64, linux/arm64)"
          echo "- **Web**: \`taskflow-web:$VERSION\` (linux/amd64, linux/arm64)"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "- **latest**: updated to \`$VERSION\`"
          else
            echo "- **latest**: not updated (branch build)"
          fi
          echo ""
          echo "AMD64 built natively on ubuntu-latest, ARM64 natively on ubuntu-24.04-arm."
        } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Octopus
    needs: [version, manifest]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    permissions:
      contents: write  # Create the GitHub release and version tag
      id-token: write  # OIDC login to Octopus

    steps:
    # GitVersion calculates the next main version from the latest tag, so every
    # main build must tag itself. Re-runs of the same build reuse the existing release.
    - name: Create GitHub release and tag
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: v${{ needs.version.outputs.version }}
      run: |
        if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
          echo "Release $TAG already exists"
        else
          gh release create "$TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "$TAG" --generate-notes
        fi

    - name: Login to Octopus Deploy
      uses: OctopusDeploy/login@v1
      with:
        server: ${{ secrets.OCTOPUS_SERVER_URL }}
        service_account_id: ${{ secrets.OCTOPUS_SERVICE_ACCOUNT_ID }}

    - name: Create test environment release
      if: github.event_name == 'pull_request'
      uses: OctopusDeploy/create-release-action@v4
      with:
        project: TaskFlow
        space: Default
        release_number: ${{ needs.version.outputs.version }}
        channel: Ephemeral Environments
        package_version: ${{ needs.version.outputs.version }}
        # Use the PR's manifests rather than main's
        git_resources: |
          Kustomize deployment:refs/heads/${{ github.head_ref }}
        custom_fields: |
          PullRequestNumber: ${{ github.event.pull_request.number }}

    - name: Create production release
      if: github.ref == 'refs/heads/main'
      uses: OctopusDeploy/create-release-action@v4
      with:
        project: TaskFlow
        space: Default
        release_number: ${{ needs.version.outputs.version }}
        channel: Release
        package_version: ${{ needs.version.outputs.version }}
