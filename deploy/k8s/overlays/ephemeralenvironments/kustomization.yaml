apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: taskflow-#{environmentName}

resources:
- ../../base

namespace: taskflow-#{environmentName}

images:
- name: mattallford/taskflow-api
  newTag: "#{Octopus.Action.Package[taskflow-api].PackageVersion}"
- name: mattallford/taskflow-web
  newTag: "#{Octopus.Action.Package[taskflow-web].PackageVersion}"

patches:
- path: configmap-patch.yaml
  target:
    kind: ConfigMap
    name: taskflow-config
- path: postgres-patch.yaml
  target:
    kind: Deployment
    name: taskflow-postgres
- path: ingress-patch.yaml
  target:
    kind: Ingress
    name: taskflow-ingress
- path: secret-patch.yaml
  target:
    kind: Secret
    name: taskflow-secrets
- path: deployment-patch.yaml
  target:
    kind: Deployment
    name: taskflow-api

labels:
- pairs:
    environment: #{environmentName}
    app.kubernetes.io/instance: taskflow-#{environmentName}

generatorOptions:
  disableNameSuffixHash: true